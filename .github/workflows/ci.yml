name: Verify Contribution Arcade

on:
  push:
    branches: [main]
    paths-ignore:
      - 'generated/**'
      - 'previews/**'
  pull_request:
    paths-ignore:
      - 'generated/**'
      - 'previews/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test the generator
        run: npm test
      - name: Rebuild the example from its saved calendar
        run: node lib/cli.js --input generated/calendar.json --context generated/context.json
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the browser flow and capture previews
        run: npm run capture
      - name: Upload SVGs and preview images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contribution-arcade-preview
          path: |
            generated/*.svg
            generated/summary.json
            generated/*-summary.json
            generated/context.json
            generated/arcade.json
            previews/*.png
          retention-days: 14
