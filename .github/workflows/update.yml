name: Refresh contribution animation

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'action.yml'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: refresh-contribution-arcade
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate the latest contribution animation
        uses: ./
        with:
          github_username: N0zoM1z0
      - name: Commit updated contribution assets
        env:
          ARCADE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add generated/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh contribution arcade' \
            -m 'Co-authored-by: gensokyo-dev <342580529+gensokyo-dev@users.noreply.github.com>'
          git push origin "HEAD:$ARCADE_BRANCH"
