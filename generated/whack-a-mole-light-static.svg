  <title id="title">N0zoM1z0 · Contribution Arcade · 19 / WHACK-A-MOLE</title>
  <desc id="desc">13,951 GitHub contributions across 138 active days, 2025-10-12 to 2026-10-14. One mole represents each active week, ordered by contribution count. Busier weeks have shorter appearance windows, while real daily streaks reduce hammer reaction time. The hammer banks weekly contributions only when it strikes before the mole hides; late swings visibly miss.</desc>
