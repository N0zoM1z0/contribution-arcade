<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="A little arcade, made from a year of GitHub contributions.">
  <title>Contribution Arcade · N0zoM1z0</title>
  <link rel="stylesheet" href="public/preview.css">
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="./" aria-label="Contribution Arcade home"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>contribution arcade</a>
      <a class="repo" href="https://github.com/N0zoM1z0/contribution-arcade" target="_blank" rel="noreferrer"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 .8a11.2 11.2 0 0 0-3.5 21.8c.6.1.8-.3.8-.6v-2.2c-3.2.7-3.8-1.4-3.8-1.4-.5-1.3-1.3-1.6-1.3-1.6-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.3 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11.2 11.2 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.1V22c0 .4.2.7.8.6A11.2 11.2 0 0 0 12 .8Z"/></svg><span>View on GitHub</span></a>
    </header>
    <main>
      <section class="hero" aria-labelledby="heading">
        <div><p class="eyebrow"><span class="dot" aria-hidden="true"></span><span id="date-label">A YEAR OF CONTRIBUTIONS</span></p><h1 id="heading">Small squares.<br><span>Big year.</span></h1></div>
        <p class="hero-aside">One year of building.<br>Nineteen ways to play, made for <a id="profile" href="https://github.com/N0zoM1z0">@N0zoM1z0</a>.<br><span id="calendar-label">The original calendar, in every scene.</span></p>
      </section>
      <div class="collection-bar">
        <nav class="scene-index" id="scene-index" aria-label="Scene categories"></nav>
        <div class="appearance" role="group" aria-label="Color theme">
          <button type="button" data-theme="dark" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M15.9 12.3A6.8 6.8 0 0 1 7.7 4.1a6.8 6.8 0 1 0 8.2 8.2Z"/></svg>Midnight</button>
          <button type="button" data-theme="light" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3"/><path d="M10 1v2m0 14v2M1 10h2m14 0h2M3.6 3.6 5 5m10 10 1.4 1.4M3.6 16.4 5 15M15 5l1.4-1.4"/></svg>Paper</button>
        </div>
      </div>
      <div id="collection" aria-busy="true"><p class="loading" role="status">A year of building. A few ways to play.</p></div>
      <noscript><p class="error">View <a href="generated/breakout-dark.svg">Breakout</a> and <a href="generated/snake-dark.svg">Growing Snake</a> as standalone animations.</p></noscript>
    </main>
    <footer class="foot"><span>YOUR COMMITS. YOUR GAME.</span><span>MADE OF SMALL, GOOD DAYS.</span></footer>
  </div>
  <template id="scene-template">
    <section class="scene">
      <object class="board" type="image/svg+xml"><p class="error">This browser cannot display the animation. Use the SVG download below.</p></object>
      <div class="toolbar">
        <div class="scene-name"><span class="number"></span><h2 data-role="title"></h2><span class="scene-subtitle"></span></div>
        <div class="playback">
          <span class="time"></span>
          <button class="icon-button expand" data-action="expand" type="button" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button>
          <button class="icon-button" data-action="pause" type="button" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 20 20"><path data-role="pause-icon" d="M7 5v10M13 5v10"/></svg></button>
          <button class="icon-button" data-action="replay" type="button"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M4 8a6 6 0 1 1 .8 6M4 3v5h5"/></svg></button>
        </div>
      </div>
      <div class="scene-details"><p data-role="description"></p><a class="download" download>Download SVG <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 2v8m-3-3 3 3 3-3M3 11v3h10v-3"/></svg></a></div>
    </section>
  </template>
  <script type="module" src="public/preview.js"></script>
</body>
</html>
